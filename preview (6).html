
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>İyi ki Doğdun 🌸</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: radial-gradient(circle at center, #211431, #080810 75%);
  color: white;
  font-family: Arial, sans-serif;
  min-height: 100vh;
  overflow: hidden;
  text-align: center;
}

.scene {
  min-height: 100vh;
  width: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 25px;
  animation: fade 1s ease;
}

.hidden {
  display: none !important;
}

@keyframes fade {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

h1 {
  font-size: clamp(34px, 8vw, 44px);
  color: #e4b5ff;
  text-shadow: 0 0 18px #a84dff;
  line-height: 1.4;
}

p {
  font-size: 25px;
  line-height: 1.7;
  color: #e8dcef;
}

button {
  background: #963fd0;
  border: 1px solid #e0aaff;
  color: white;
  padding: 17px 38px;
  border-radius: 40px;
  font-size: 21px;
  margin-top: 25px;
  cursor: pointer;
  box-shadow: 0 0 25px #963dce77;
  transition: .3s;
}

button:active {
  transform: scale(.94);
}

#heart {
  width: min(90vw, 420px);
  height: 320px;
}

.flower {
  width: 220px;
  height: 260px;
  position: relative;
  margin: 20px;
}

.stem {
  position: absolute;
  width: 5px;
  height: 0;
  background: linear-gradient(#72e89c, #258d67);
  left: 108px;
  bottom: 0;
  border-radius: 10px;
  animation: stem 3s forwards;
}

@keyframes stem {
  to { height: 170px; }
}

.leaf {
  position: absolute;
  width: 55px;
  height: 24px;
  background: #50b77c;
  border-radius: 100% 0 100% 0;
  left: 55px;
  bottom: 65px;
  transform: rotate(20deg);
  opacity: 0;
  animation: leaf 1s 2s forwards;
}

.leaf.two {
  left: 110px;
  bottom: 105px;
  transform: rotate(160deg);
}

@keyframes leaf {
  to { opacity: 1; }
}

.bloom {
  position: absolute;
  top: 35px;
  left: 77px;
  width: 65px;
  height: 65px;
  transform: scale(0);
  animation: bloom 2s 2.5s forwards;
}

@keyframes bloom {
  to { transform: scale(1); }
}

.petal {
  position: absolute;
  width: 32px;
  height: 48px;
  left: 17px;
  top: 0;
  border-radius: 50%;
  background: linear-gradient(#e7b1ff, #9236db);
  box-shadow: 0 0 16px #bc65ff;
  transform-origin: bottom center;
}

.petal:nth-child(2) { transform: rotate(60deg); }
.petal:nth-child(3) { transform: rotate(120deg); }
.petal:nth-child(4) { transform: rotate(180deg); }
.petal:nth-child(5) { transform: rotate(240deg); }
.petal:nth-child(6) { transform: rotate(300deg); }

.center {
  position: absolute;
  top: 27px;
  left: 27px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: #ffe9a4;
  box-shadow: 0 0 18px #ffe9a4;
}

.star {
  position: fixed;
  bottom: -35px;
  pointer-events: none;
  animation: float 6s linear forwards;
}

@keyframes float {
  to {
    transform: translateY(-110vh) rotate(360deg);
    opacity: 0;
  }
}

#msg {
  max-width: 90%;
  min-height: 150px;
  font-size: clamp(27px, 7vw, 34px);
  color: #edc8ff;
  line-height: 1.8;
  text-shadow: 0 0 12px #a84dff;
  display: flex;
  align-items: center;
  justify-content: center;
}

@media(max-height:650px) {
  .scene { padding: 12px; }
  h1 { font-size: 30px; }
  p { font-size: 20px; }
  #heart { height: 230px; }
  .flower { transform: scale(.8); margin: 0; }
}
</style>
</head>

<body>

<!-- İLK EKRAN -->

<div class="scene" id="intro">
  <h1>Son birkaç şey... 💜</h1>

  <p>İyi ki varsın. 💜</p>

  <button onclick="start()">Devam et ✨</button>
</div>

<!-- NEON KALP -->

<div class="scene hidden" id="heartScene">

  <h1>İYİ Kİ DOĞDUN ❤️</h1>

  <canvas id="heart" width="420" height="320"></canvas>

  <p>Bu kalp sana özel çizildi.</p>

  <button onclick="flowers()">Devam et 🌸</button>

</div>

<!-- ÇİÇEK ANİMASYONU -->

<div class="scene hidden" id="flowerScene">

  <h1>Senin için... 💜</h1>

  <div class="flower">

    <div class="stem"></div>
    <div class="leaf"></div>
    <div class="leaf two"></div>

    <div class="bloom">
      <div class="petal"></div>
      <div class="petal"></div>
      <div class="petal"></div>
      <div class="petal"></div>
      <div class="petal"></div>
      <div class="petal"></div>
      <div class="center"></div>
    </div>

  </div>

  <p>İyi ki varsın! 🌷</p>

  <button onclick="messages()">Bir şey daha var 😂</button>

</div>

<!-- MESAJLAR -->

<div class="scene hidden" id="messageScene">

  <h1>Son birkaç şey... 💜</h1>

  <div id="msg"></div>

  <button id="next" onclick="nextMessage()">
    Devam et ✨
  </button>

</div>

<script>

// EKRAN DEĞİŞTİRME

function show(id) {
  document.querySelectorAll('.scene').forEach(s => {
    s.classList.add('hidden');
  });

  document.getElementById(id).classList.remove('hidden');
}

// UÇUŞAN YILDIZLAR

function stars() {
  setInterval(() => {

    let s = document.createElement('div');

    s.className = 'star';

    s.textContent = ['✦', '✨', '💜', '🌸', '♡'][
      Math.floor(Math.random() * 5)
    ];

    s.style.left = Math.random() * 100 + 'vw';
    s.style.fontSize = (15 + Math.random() * 18) + 'px';

    document.body.appendChild(s);

    setTimeout(() => s.remove(), 6000);

  }, 650);
}

stars();

// KALP EKRANI

function start() {
  show('heartScene');
  drawHeart();
}

// KENDİLİĞİNDEN ÇİZİLEN KALP

function drawHeart() {

  let c = document.getElementById('heart');
  let ctx = c.getContext('2d');

  let progress = 0;

  function frame() {

    ctx.clearRect(0, 0, 420, 320);
    ctx.beginPath();

    for (let i = 0; i <= progress; i++) {

      let t = i / 100 * Math.PI * 2;

      let x = 210 + 16 * Math.pow(Math.sin(t), 3) * 7;

      let y = 145 - (
        13 * Math.cos(t)
        - 5 * Math.cos(2 * t)
        - 2 * Math.cos(3 * t)
        - Math.cos(4 * t)
      ) * 7;

      if (i === 0) {
        ctx.moveTo(x, y);
      } else {
        ctx.lineTo(x, y);
      }
    }

    ctx.strokeStyle = '#ff477e';
    ctx.lineWidth = 3;
    ctx.shadowColor = '#ff477e';
    ctx.shadowBlur = 22;
    ctx.stroke();

    progress++;

    if (progress <= 100) {
      requestAnimationFrame(frame);
    }
  }

  frame();
}

// ÇİÇEK

function flowers() {
  show('flowerScene');
}

// MESAJLAR

let texts = [

  'İyi ki doğdun! 🎂🌸',

  'İyi ki varsın. 💜',

  'Sen olmazsan kim soğanları soyacak? 🧅😂',

  'Umarım her zaman yüzün güler. ✨',

  'Hayatın hep çiçekler kadar güzel olsun. 🌷',

  'İyi ki tanımışım seni! 💜',

  'Nice güzel yaşlara! 🎉'

];

let index = 0;

function messages() {
  show('messageScene');
  index = 0;
  update();
}

// MESAJ GEÇİŞİ

function update() {

  let msg = document.getElementById('msg');

  msg.style.opacity = 0;

  setTimeout(() => {
    msg.textContent = texts[index];
    msg.style.transition = 'opacity .7s';
    msg.style.opacity = 1;
  }, 300);

}

// SONRAKİ MESAJ

function nextMessage() {

  index++;

  if (index < texts.length) {

    update();

  } else {

    document.getElementById('msg').innerHTML =
      'İYİ Kİ DOĞDUN! 💜<br><br>' +
      'Çiçeklerin hiç solmasın,<br>' +
      'soğanların hiç bitmesin! 🧅😂';

    document.getElementById('next').style.display = 'none';

  }

}

</script>

</body>
</html>
